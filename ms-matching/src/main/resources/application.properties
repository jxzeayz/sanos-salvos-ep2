spring.application.name=ms-matching
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_matching
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ — conexión
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ — consumidores con ACK manual (sin reencolar por defecto: los
# mensajes rechazados van a la DLQ configurada en la cola)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# RabbitMQ — productores con confirmación del broker y retorno de mensajes sin ruta
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ─── Mensajería: nombres de exchanges, colas y routing keys (centralizados) ──
mensajeria.exchange=${RABBITMQ_EXCHANGE:sanos-salvos.events}
mensajeria.dlx=${RABBITMQ_DLX:sanos-salvos.dlx}
mensajeria.cola.nombre=q.matching
mensajeria.cola.dlq=q.matching.dlq
mensajeria.cola.binding-key=mascota.*
mensajeria.routing-keys.coincidencia-hallada=coincidencia.hallada
mensajeria.routing-keys.mascota-eliminada=mascota.eliminada
mensajeria.no-entregados.cola=q.no-entregados
mensajeria.no-entregados.routing-key=no-entregados

# Matching
matching.score-minimo=0.60

# Resilience4j
resilience4j.circuitbreaker.instances.matching-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.matching-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.matching-service.wait-duration-in-open-state=10s

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
