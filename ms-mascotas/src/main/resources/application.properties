spring.application.name=ms-mascotas
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_mascotas
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ — productor con confirmación del broker y retorno de mensajes sin ruta
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ─── Mensajería: nombres de exchanges, colas y routing keys (centralizados) ──
mensajeria.exchange=${RABBITMQ_EXCHANGE:sanos-salvos.events}
mensajeria.dlx=${RABBITMQ_DLX:sanos-salvos.dlx}
mensajeria.routing-keys.prefijo-mascota=mascota
mensajeria.routing-keys.mascota-eliminada=mascota.eliminada
mensajeria.no-entregados.cola=q.no-entregados
mensajeria.no-entregados.routing-key=no-entregados

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.matching-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.matching-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.matching-service.wait-duration-in-open-state=10s

# IDaaS (Auth0) — validación de tokens RS256
auth0.domain=${AUTH0_DOMAIN:dev-nn2816yh03z0o4fk.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://sanosysalvos/api}

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
