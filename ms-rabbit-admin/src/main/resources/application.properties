spring.application.name=ms-rabbit-admin
server.port=8088

# ─── Conexión AMQP (RabbitAdmin / AmqpAdmin) ────────────────────────────────
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# ─── API HTTP de administración de RabbitMQ (solo lectura: listados) ────────
rabbit-admin.management.url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
rabbit-admin.management.username=${SPRING_RABBITMQ_USERNAME:guest}
rabbit-admin.management.password=${SPRING_RABBITMQ_PASSWORD:guest}
rabbit-admin.management.vhost=/

# ─── Recursos del sistema que NO se pueden eliminar desde la API ────────────
# (exchanges, colas y DLQ que usan los demás microservicios). Los nombres que
# comienzan con "amq." y el exchange por defecto siempre están protegidos.
rabbit-admin.recursos-protegidos=sanos-salvos.events,sanos-salvos.dlx,\
  q.matching,q.matching.dlq,\
  q.notificaciones,q.notificaciones.dlq,\
  q.geolocalizacion,q.geolocalizacion.dlq,\
  q.auditoria,q.auditoria.dlq,\
  q.no-entregados

# ─── IDaaS (Auth0) — validación de tokens RS256 ────────────────────────────
auth0.domain=${AUTH0_DOMAIN:dev-nn2816yh03z0o4fk.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://sanosysalvos/api}

# ─── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
