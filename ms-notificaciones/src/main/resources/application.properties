server.port=8085
spring.application.name=ms-notificaciones
spring.datasource.url=jdbc:postgresql://postgres-notificaciones:5432/db_notificaciones
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# RabbitMQ — consumidores con ACK manual; lo rechazado va a la DLQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
# ─── Mensajería: nombres de exchanges, colas y routing keys (centralizados) ──
mensajeria.exchange=${RABBITMQ_EXCHANGE:sanos-salvos.events}
mensajeria.dlx=${RABBITMQ_DLX:sanos-salvos.dlx}
mensajeria.cola.nombre=q.notificaciones
mensajeria.cola.dlq=q.notificaciones.dlq
mensajeria.cola.binding-key=coincidencia.*
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notificaciones@sanosysalvos.com
spring.mail.password=tu_password_aqui
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true