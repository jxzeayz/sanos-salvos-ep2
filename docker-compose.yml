services:

  # ─── Infraestructura ───────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AUTH:-db_auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_AUTH:-db_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-mascotas:
    image: postgres:16
    container_name: postgres-mascotas
    environment:
      POSTGRES_DB: ${POSTGRES_DB_MASCOTAS:-db_mascotas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_mascotas_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_MASCOTAS:-db_mascotas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-geo:
    image: postgis/postgis:16-3.4
    container_name: postgres-geo
    environment:
      POSTGRES_DB: ${POSTGRES_DB_GEO:-db_geo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_geo_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_GEO:-db_geo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-matching:
    image: postgres:16
    container_name: postgres-matching
    environment:
      POSTGRES_DB: ${POSTGRES_DB_MATCHING:-db_matching}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_matching_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_MATCHING:-db_matching}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notificaciones:
    image: postgres:16
    container_name: postgres-notificaciones
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NOTIFICACIONES:-db_notificaciones}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_notificaciones_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_NOTIFICACIONES:-db_notificaciones}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-archivos:
    image: postgres:16
    container_name: postgres-archivos
    environment:
      POSTGRES_DB: ${POSTGRES_DB_ARCHIVOS:-db_archivos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_archivos_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_ARCHIVOS:-db_archivos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auditoria:
    image: postgres:16
    container_name: postgres-auditoria
    environment:
      POSTGRES_DB: ${POSTGRES_DB_AUDITORIA:-db_auditoria}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - pg_auditoria_data:/var/lib/postgresql/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_AUDITORIA:-db_auditoria}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ: clúster de 2 nodos ─────────────────────────────────────────

  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbitmq1            # el nombre del nodo queda como rabbit@rabbitmq1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-sanos-salvos-cluster-cookie}
    # Los nodos de un clúster deben compartir la misma Erlang cookie. En la imagen,
    # /root/.erlang.cookie apunta a este mismo archivo, así las CLI (healthcheck) usan la misma.
    command: >
      sh -c "printf '%s' \"$$RABBITMQ_COOKIE\" > /var/lib/rabbitmq/.erlang.cookie &&
             chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie &&
             chmod 400 /var/lib/rabbitmq/.erlang.cookie &&
             exec docker-entrypoint.sh rabbitmq-server"
    expose:
      - "5672"
    ports:
      - "15672:15672"   # consola del nodo 1 (http://localhost:15672, guest/guest)
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2            # el nombre del nodo queda como rabbit@rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-sanos-salvos-cluster-cookie}
    # Los nodos de un clúster deben compartir la misma Erlang cookie. En la imagen,
    # /root/.erlang.cookie apunta a este mismo archivo, así las CLI (healthcheck) usan la misma.
    command: >
      sh -c "printf '%s' \"$$RABBITMQ_COOKIE\" > /var/lib/rabbitmq/.erlang.cookie &&
             chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie &&
             chmod 400 /var/lib/rabbitmq/.erlang.cookie &&
             exec docker-entrypoint.sh rabbitmq-server"
    expose:
      - "5672"
    ports:
      - "15673:15672"   # consola del nodo 2 (http://localhost:15673, guest/guest)
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Forma el clúster y aplica la política de réplica (se ejecuta una vez y termina):
  #   1. une rabbit@rabbitmq2 al clúster de rabbit@rabbitmq1 (si aún no está unido)
  #   2. política ha-colas-sanos: las colas q.* y sus DLQ se replican en ambos nodos
  rabbitmq-cluster-init:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-cluster-init
    hostname: rabbitmq-cluster-init
    environment:
      RABBITMQ_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-sanos-salvos-cluster-cookie}
    entrypoint: >
      sh -c "printf '%s' \"$$RABBITMQ_COOKIE\" > /var/lib/rabbitmq/.erlang.cookie &&
             chmod 400 /var/lib/rabbitmq/.erlang.cookie &&
             if rabbitmqctl -n rabbit@rabbitmq1 cluster_status | grep -q 'rabbit@rabbitmq2'; then
               echo 'rabbitmq2 ya pertenece al cluster';
             else
               rabbitmqctl -n rabbit@rabbitmq2 stop_app &&
               rabbitmqctl -n rabbit@rabbitmq2 reset &&
               rabbitmqctl -n rabbit@rabbitmq2 join_cluster rabbit@rabbitmq1 &&
               rabbitmqctl -n rabbit@rabbitmq2 start_app || exit 1;
             fi &&
             rabbitmqctl -n rabbit@rabbitmq1 set_policy --apply-to queues --priority 1 ha-colas-sanos '^q\\.' '{\"ha-mode\":\"all\",\"ha-sync-mode\":\"automatic\"}' &&
             rabbitmqctl -n rabbit@rabbitmq1 cluster_status"
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    networks:
      - sanos-net
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASS:-minioadmin};
        mc mb local/archivos --ignore-existing;
        echo 'Bucket archivos listo';
      "
    networks:
      - sanos-net

  # ─── API Manager (Kong) ────────────────────────────────────────────────────

  kong:
    image: kong:3.8
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PLUGINS: bundled,cors
      KONG_DNS_ORDER: LAST,A,CNAME
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    networks:
      - sanos-net
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  konga-db:
    image: mongo:4.4
    container_name: konga-db
    command: mongod --quiet
    expose:
      - "27017"
    volumes:
      - mongo_konga_data:/data/db
    networks:
      - sanos-net
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 5

  konga:
    image: pantsel/konga:latest
    container_name: konga
    environment:
      NODE_ENV: production
      DB_ADAPTER: mongo
      DB_URI: mongodb://konga-db:27017/konga
      KONGA_HOOK_TIMEOUT: 120000
    ports:
      - "8085:1337"
    depends_on:
      konga-db:
        condition: service_healthy
    networks:
      - sanos-net
    restart: on-failure

  # ─── Microservicios ────────────────────────────────────────────────────────

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_AUTH:-jdbc:postgresql://postgres-auth:5432/${POSTGRES_DB_AUTH:-db_auth}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-nn2816yh03z0o4fk.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://sanosysalvos/api}
    expose:
      - "8084"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - sanos-net
    restart: on-failure

  ms-mascotas:
    build: ./ms-mascotas
    container_name: ms-mascotas
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_MASCOTAS:-jdbc:postgresql://postgres-mascotas:5432/${POSTGRES_DB_MASCOTAS:-db_mascotas}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-sanos-salvos.events}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-nn2816yh03z0o4fk.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://sanosysalvos/api}
    expose:
      - "8081"
    depends_on:
      postgres-mascotas:
        condition: service_healthy
      rabbitmq-cluster-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  ms-geolocalizacion:
    build: ./ms-geolocalizacion
    container_name: ms-geolocalizacion
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_GEO:-jdbc:postgresql://postgres-geo:5432/${POSTGRES_DB_GEO:-db_geo}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-sanos-salvos.events}
    expose:
      - "8082"
    depends_on:
      postgres-geo:
        condition: service_healthy
      rabbitmq-cluster-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  ms-matching:
    build: ./ms-matching
    container_name: ms-matching
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_MATCHING:-jdbc:postgresql://postgres-matching:5432/${POSTGRES_DB_MATCHING:-db_matching}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-sanos-salvos.events}
    expose:
      - "8083"
    depends_on:
      postgres-matching:
        condition: service_healthy
      rabbitmq-cluster-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: ms-notificaciones
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_NOTIFICACIONES:-jdbc:postgresql://postgres-notificaciones:5432/${POSTGRES_DB_NOTIFICACIONES:-db_notificaciones}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-sanos-salvos.events}
      SPRING_MAIL_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USER:-notificaciones@sanosysalvos.com}
      SPRING_MAIL_PASSWORD: ${SMTP_PASS}
    expose:
      - "8085"
    depends_on:
      postgres-notificaciones:
        condition: service_healthy
      rabbitmq-cluster-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  ms-archivos:
    build: ./ms-archivos
    container_name: ms-archivos
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_ARCHIVOS:-jdbc:postgresql://postgres-archivos:5432/${POSTGRES_DB_ARCHIVOS:-db_archivos}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      SPRING_MINIO_ENDPOINT: http://minio:9000
      SPRING_MINIO_ACCESSKEY: ${MINIO_USER:-minioadmin}
      SPRING_MINIO_SECRETKEY: ${MINIO_PASS:-minioadmin}
      SPRING_MINIO_BUCKET: archivos
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-nn2816yh03z0o4fk.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://sanosysalvos/api}
    expose:
      - "8086"
    depends_on:
      postgres-archivos:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  ms-auditoria:
    build: ./ms-auditoria
    container_name: ms-auditoria
    environment:
      SPRING_DATASOURCE_URL: ${NEON_DB_AUDITORIA:-jdbc:postgresql://postgres-auditoria:5432/${POSTGRES_DB_AUDITORIA:-db_auditoria}}
      SPRING_DATASOURCE_USERNAME: ${NEON_DB_USER:-${POSTGRES_USER:-postgres}}
      SPRING_DATASOURCE_PASSWORD: ${NEON_DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-sanos-salvos.events}
    expose:
      - "8087"
    depends_on:
      postgres-auditoria:
        condition: service_healthy
      rabbitmq-cluster-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    container_name: ms-rabbit-admin
    environment:
      SPRING_RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq1:15672
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-nn2816yh03z0o4fk.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://sanosysalvos/api}
    expose:
      - "8088"
    depends_on:
      rabbitmq-cluster-init:
        condition: service_completed_successfully
    networks:
      - sanos-net
    restart: on-failure

  bff-web:
    build: ./bff-web
    container_name: bff-web
    environment:
      SERVICES_AUTH_URL: http://ms-auth:8084
      SERVICES_MASCOTAS_URL: http://ms-mascotas:8081
      SERVICES_GEO_URL: http://ms-geolocalizacion:8082
      SERVICES_MATCHING_URL: http://ms-matching:8083
      SERVICES_NOTIFICACIONES_URL: http://ms-notificaciones:8085
      SERVICES_ARCHIVOS_URL: http://ms-archivos:8086
      SERVICES_AUDITORIA_URL: http://ms-auditoria:8087
      SERVICES_RABBIT_ADMIN_URL: http://ms-rabbit-admin:8088
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-nn2816yh03z0o4fk.us.auth0.com}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://sanosysalvos/api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,https://localhost}
    expose:
      - "8080"
    depends_on:
      - ms-auth
      - ms-mascotas
      - ms-geolocalizacion
      - ms-matching
      - ms-notificaciones
      - ms-archivos
      - ms-auditoria
      - ms-rabbit-admin
    networks:
      - sanos-net
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - kong
      - bff-web
    networks:
      - sanos-net
    restart: on-failure

volumes:
  mongo_konga_data:
  pg_auth_data:
  pg_mascotas_data:
  pg_geo_data:
  pg_matching_data:
  pg_notificaciones_data:
  pg_archivos_data:
  pg_auditoria_data:
  minio_data:

networks:
  sanos-net:
    driver: bridge
