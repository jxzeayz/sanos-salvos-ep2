spring.application.name=ms-geolocalizacion
server.port=8082

# PostgreSQL con PostGIS
spring.datasource.url=jdbc:postgresql://db-geo:5432/db_geo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA con Hibernate Spatial
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ — consumidores con ACK manual; lo rechazado va a la DLQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10

# RabbitMQ — productores con confirmación del broker y retorno de mensajes sin ruta
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ─── Mensajería: nombres de exchanges, colas y routing keys (centralizados) ──
mensajeria.exchange=${RABBITMQ_EXCHANGE:sanos-salvos.events}
mensajeria.dlx=${RABBITMQ_DLX:sanos-salvos.dlx}
mensajeria.cola.nombre=q.geolocalizacion
mensajeria.cola.dlq=q.geolocalizacion.dlq
mensajeria.cola.binding-keys=mascota.perdida,mascota.encontrada
mensajeria.routing-keys.zona-actualizada=zona.actualizada
mensajeria.no-entregados.cola=q.no-entregados
mensajeria.no-entregados.routing-key=no-entregados

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
