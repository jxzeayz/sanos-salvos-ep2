spring.application.name=ms-auth
server.port=8084

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_auth
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# IDaaS (Auth0) — validación de tokens RS256
auth0.domain=${AUTH0_DOMAIN:dev-nn2816yh03z0o4fk.us.auth0.com}
auth0.audience=${AUTH0_AUDIENCE:https://sanosysalvos/api}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
