server.port=8087
spring.application.name=ms-auditoria
spring.datasource.url=jdbc:postgresql://postgres-auditoria:5432/db_auditoria
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# RabbitMQ — consumidores con ACK manual; lo rechazado va a la DLQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
# ─── Mensajería: nombres de exchanges, colas y routing keys (centralizados) ──
mensajeria.exchange=${RABBITMQ_EXCHANGE:sanos-salvos.events}
mensajeria.dlx=${RABBITMQ_DLX:sanos-salvos.dlx}
mensajeria.cola.nombre=q.auditoria
mensajeria.cola.dlq=q.auditoria.dlq
mensajeria.cola.binding-key=*.*
