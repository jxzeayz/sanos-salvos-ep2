<div class="mapa-reportes">
  <div class="mapa-leyenda">
    <mat-chip color="warn" selected><mat-icon matChipAvatar>location_on</mat-icon>Perdida</mat-chip>
    <mat-chip color="primary" selected><mat-icon matChipAvatar>location_on</mat-icon>Encontrada</mat-chip>
    <span class="mapa-nota">
      · Las ubicaciones se muestran con imprecisión de 500m para proteger la privacidad
    </span>
  </div>

  <div *ngIf="loading" class="centrado"><mat-spinner></mat-spinner></div>

  <div *ngIf="error" class="aviso">{{ error }}</div>

  <div id="mapa-reportes"></div>
</div>
